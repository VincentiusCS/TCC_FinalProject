<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoERP | KPI Management</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "on-tertiary": "#ffffff",
              "inverse-surface": "#2f3037",
              "surface-container": "#eeedf7",
              "surface-tint": "#3755c3",
              "surface-container-low": "#f4f2fc",
              "inverse-primary": "#b8c4ff",
              "on-secondary-fixed-variant": "#454747",
              "surface-dim": "#dad9e3",
              "secondary": "#5d5f5f",
              "surface-container-high": "#e8e7f1",
              "on-error": "#ffffff",
              "primary-fixed": "#dde1ff",
              "error": "#ba1a1a",
              "error-container": "#ffdad6",
              "tertiary-fixed-dim": "#ffb59a",
              "tertiary-container": "#872d00",
              "inverse-on-surface": "#f1f0fa",
              "on-surface": "#1a1b22",
              "on-secondary": "#ffffff",
              "on-secondary-fixed": "#1a1c1c",
              "on-error-container": "#93000a",
              "on-primary-fixed": "#001453",
              "surface-container-highest": "#e3e1eb",
              "background": "#fbf8ff",
              "outline-variant": "#c4c5d5",
              "tertiary-fixed": "#ffdbce",
              "on-background": "#1a1b22",
              "on-surface-variant": "#444653",
              "primary-fixed-dim": "#b8c4ff",
              "surface-container-lowest": "#ffffff",
              "surface": "#fbf8ff",
              "on-tertiary-fixed-variant": "#802a00",
              "tertiary": "#611e00",
              "surface-variant": "#e3e1eb",
              "on-tertiary-fixed": "#380d00",
              "on-primary": "#ffffff",
              "on-primary-container": "#a8b8ff",
              "on-tertiary-container": "#ffa583",
              "secondary-container": "#dfe0e0",
              "secondary-fixed": "#e2e2e2",
              "primary": "#00288e",
              "on-secondary-container": "#616363",
              "primary-container": "#1e40af",
              "outline": "#757684",
              "on-primary-fixed-variant": "#173bab",
              "secondary-fixed-dim": "#c6c6c7",
              "surface-bright": "#fbf8ff"
            },
            "borderRadius": {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",
              "xl": "0.5rem",
              "full": "0.75rem"
            },
            "spacing": {
              "stack_sm": "8px",
              "stack_lg": "24px",
              "gutter": "24px",
              "header_height": "64px",
              "sidebar_expanded": "260px",
              "stack_md": "16px",
              "sidebar_collapsed": "72px"
            },
            "fontFamily": {
              "body-md": ["Inter"],
              "headline-lg": ["Inter"],
              "headline-xl": ["Inter"],
              "body-lg": ["Inter"],
              "label-sm": ["Inter"],
              "code-md": ["Inter"],
              "headline-md": ["Inter"]
            },
            "fontSize": {
              "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
              "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
              "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
              "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
              "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
              "code-md": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
              "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fbf8ff;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #c4c5d5; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #f1f0fa; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #c4c5d5; border-radius: 10px; }
      .kpi-score-badge {
        background: linear-gradient(135deg, #00288e 0%, #1e40af 100%);
      }
      @media print {
        .no-print { display: none !important; }
      }
    </style>
  </head>
  <body class="bg-background text-on-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
