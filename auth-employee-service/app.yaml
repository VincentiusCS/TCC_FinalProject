runtime: nodejs20
service: auth-employee-service

instance_class: F2

automatic_scaling:
  min_instances: 1
  max_instances: 5

env_variables:
  NODE_ENV: production
  PORT: "8080"
  # DB and GCS variables should be injected via Secret Manager or CI/CD pipeline
  # DB_HOST: <from-secret-manager>
  # DB_PORT: "3306"
  # DB_USER: <from-secret-manager>
  # DB_PASSWORD: <from-secret-manager>
  # DB_NAME: erp_master_db
  # GCS_BUCKET_NAME: <your-bucket-name>
  # JWT_SECRET: <from-secret-manager>

handlers:
  - url: /.*
    script: auto
    secure: always
