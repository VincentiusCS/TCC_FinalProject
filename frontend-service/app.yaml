runtime: nodejs22
service: default

handlers:
  - url: /assets
    static_dir: dist/assets
    secure: always

  - url: /(.*\.(js|css|ico|png|jpg|jpeg|svg|gif|webp|json|woff|woff2|ttf|eot))$
    static_files: dist/\1
    upload: dist/.*\.(js|css|ico|png|jpg|jpeg|svg|gif|webp|json|woff|woff2|ttf|eot)$
    secure: always

  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
    secure: always
