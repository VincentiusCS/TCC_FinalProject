services:
  # ── MySQL: erp_master_db ────────────────────────────────────────────────────
  master-db:
    image: mysql:8.0
    container_name: erp_master_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: erp_master_db
    ports:
      - "3308:3306"
    volumes:
      - master_db_data:/var/lib/mysql
      - ./database/erp_master_db.sql:/docker-entrypoint-initdb.d/erp_master_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MySQL: erp_kpi_payroll_db ───────────────────────────────────────────────
  kpi-db:
    image: mysql:8.0
    container_name: erp_kpi_payroll_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: erp_kpi_payroll_db
    ports:
      - "3307:3306"
    volumes:
      - kpi_db_data:/var/lib/mysql
      - ./database/erp_kpi_payroll_db.sql:/docker-entrypoint-initdb.d/erp_kpi_payroll_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── auth-employee-service ───────────────────────────────────────────────────
  auth-employee-service:
    build:
      context: ./auth-employee-service
      dockerfile: Dockerfile
    container_name: auth_employee_service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: master-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: erp_master_db
      JWT_SECRET: local_dev_secret_change_in_production
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-your-bucket-name}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    depends_on:
      master-db:
        condition: service_healthy

  # ── kpi-payroll-service ─────────────────────────────────────────────────────
  kpi-payroll-service:
    build:
      context: ./kpi-payroll-service
      dockerfile: Dockerfile
    container_name: kpi_payroll_service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: kpi-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: erp_kpi_payroll_db
      AUTH_SERVICE_URL: http://auth-employee-service:3001
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-your-bucket-name}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    depends_on:
      kpi-db:
        condition: service_healthy
      auth-employee-service:
        condition: service_started

  # ── frontend-service ────────────────────────────────────────────────────────
  frontend-service:
    build:
      context: ./frontend-service
      dockerfile: Dockerfile
    container_name: frontend_service
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - auth-employee-service
      - kpi-payroll-service

volumes:
  master_db_data:
  kpi_db_data:
