runtime: nodejs20
service: auth-employee-service

instance_class: F2

automatic_scaling:
  min_instances: 1
  max_instances: 5

env_variables:
  NODE_ENV: production
  PORT: "8080"
  DB_HOST: "/cloudsql/PROJECT_ID:asia-southeast2:erp-mysql"
  DB_PORT: "3306"
  DB_USER: root
  DB_PASSWORD: "GANTI_DENGAN_PASSWORD_DB"
  DB_NAME: erp_master_db
  JWT_SECRET: "GANTI_DENGAN_JWT_SECRET"
  GCS_BUCKET_NAME: "GANTI_DENGAN_NAMA_BUCKET"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "100"

beta_settings:
  cloud_sql_instances: "PROJECT_ID:asia-southeast2:erp-mysql"

handlers:
  - url: /.*
    script: auto
    secure: always
